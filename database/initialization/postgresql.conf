# PostgreSQL 17 Configuration for Tuning & Evaluation Lab
# Tuned initially with baseline defaults + full observability for pgBadger,
# pgMustard, dbForge Studio, and postgresqltuner.

# --- Connection & Memory Baseline ---
listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 16MB
max_wal_size = 1GB
min_wal_size = 80MB

# --- Query Planner & I/O Timing ---
random_page_cost = 1.1
effective_io_concurrency = 200
track_io_timing = on
track_activities = on
track_counts = on
track_functions = all

# --- Extensions ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on

# --- Logging Configuration (pgBadger Compatible) ---
logging_collector = on
# Relative to $PGDATA (/var/lib/postgresql/data/pgdata/log) so UID 999 (postgres) owns it reliably across OSes
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_file_mode = 0644
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off

log_destination = 'stderr'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
lc_messages = 'C'

# Log all statements >= 0ms by default so pgBadger captures full workload profile.
# Note: Overhead experiments explicitly compare log_min_duration_statement = 0 vs 100 vs -1.
log_min_duration_statement = 0
log_duration = off
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default
